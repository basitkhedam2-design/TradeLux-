<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#087f80"><title>TradeLux</title>
<style>
:root{--teal:#087f80;--dark:#07575b;--mint:#e7f5f2;--bg:#f3f7f7;--ink:#173638;--muted:#71898a;--line:#e2ebeb;--danger:#c34450;--gold:#b98221}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}header{background:linear-gradient(120deg,#064f56,#0b9b91);color:white;padding:17px 16px;position:sticky;top:0;z-index:5;box-shadow:0 4px 16px #1239}
.head{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:23px;font-weight:850;letter-spacing:.4px}.tag{font-size:11px;opacity:.8}.wrap{max-width:1100px;margin:auto;padding:12px}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:65px;background:var(--bg);z-index:4;scrollbar-width:thin}nav button{border:0;border-radius:20px;padding:9px 13px;background:#e4eeee;color:var(--dark);font-weight:700;white-space:nowrap}nav button.active,.primary{background:var(--teal);color:#fff}
h2{font-size:19px;margin:8px 0 13px}h3{font-size:15px;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 16px #164a4a08;margin-bottom:11px}.metric{font-size:11px;color:var(--muted)}.value{font-size:22px;font-weight:850;margin-top:4px;overflow-wrap:anywhere}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:7px}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d7e4e4;border-radius:10px;background:#fff;color:var(--ink);margin:4px 0 7px;min-width:0}textarea{min-height:65px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:10px;padding:10px 13px;background:#e5eeee;color:var(--dark);font-weight:700}.btn.primary{background:var(--teal);color:white}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.small{padding:6px 8px;font-size:12px}
.actions{display:flex;gap:5px;flex-wrap:wrap}.list{display:grid;gap:8px}.record{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px}.record small{display:block;color:var(--muted);margin-top:3px}.record b{overflow-wrap:anywhere}.muted{color:var(--muted)}.badge{font-size:10px;background:var(--mint);color:var(--dark);border-radius:20px;padding:4px 7px}.notice{padding:11px;border-radius:12px;background:#fff7e5;color:#75591f;font-size:12px;margin:10px 0}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}.hidden{display:none!important}.footer{text-align:center;color:#91a3a3;font-size:11px;padding:22px}.login{max-width:390px;margin:12vh auto}.right{text-align:right}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.contentgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
</style></head><body>
<header><div class="head"><div><div class="logo">TradeLux</div><div class="tag">SMART WHOLESALE & RETAIL MANAGER</div></div><div class="tag">OFFLINE BUSINESS</div></div></header>
<div class="wrap">
<div id="login" class="card login"><div class="logo" style="color:var(--teal)">Welcome to TradeLux</div><p class="muted">Sign in to manage your business</p><label>Username</label><input id="user" value="admin"><label>Password</label><input id="pass" type="password" value="1234"><button class="btn primary" style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button><p class="muted" style="font-size:12px">Default: admin / 1234. Change credentials in Settings.</p></div>
<div id="workspace" class="hidden"><nav id="nav"></nav><main id="screen"></main><div class="footer">Created by Abdul Basit Khedam · TradeLux</div></div>
</div>
<script>
const KEYS=['products','customers','suppliers','sales','purchases','expenses','customerTx','supplierTx'];
const blank=()=>({products:[],customers:[],suppliers:[],sales:[],purchases:[],expenses:[],customerTx:[],supplierTx:[],settings:{username:'admin',password:'1234',business:'My Business'}});
let db=load(),section='Dashboard',editing=null;
function load(){try{let x=JSON.parse(localStorage.getItem('tradelux_full')||'null');return x&&KEYS.every(k=>Array.isArray(x[k]))?x:blank()}catch(e){return blank()}}
function persist(){localStorage.setItem('tradelux_full',JSON.stringify(db))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(n,c='AFN'){return Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})+' '+c}
function today(){return new Date().toLocaleDateString()}
function signIn(){if(user.value===db.settings.username&&pass.value===db.settings.password){sessionStorage.tl='1';start()}else alert('Incorrect login details')}
function start(){login.classList.add('hidden');workspace.classList.remove('hidden');drawNav();render()}
if(sessionStorage.tl)start();
const pages=['Dashboard','Sales','Purchases','Stock','Customers','Suppliers','Expenses','Ledger','Reports','Backup','Settings'];
function drawNav(){nav.innerHTML=pages.map(p=>`<button class="${p===section?'active':''}" onclick="go('${p}')">${p}</button>`).join('')}
function go(p){section=p;editing=null;drawNav();render()}
function f(label,name,type='text',required=true,extra=''){return `<label>${label}</label><input name="${name}" type="${type}" ${required?'required':''} ${extra}>`}
function cur(){return `<label>Currency</label><select name="currency"><option>AFN</option><option>USD</option></select>`}
function form(title,body,handler){return `<section class="card"><h2>${title}</h2><form onsubmit="${handler}(event)">${body}<div class="actions"><button class="btn primary" type="submit">${editing?'Update':'Save'}</button><button class="btn" type="reset" onclick="editing=null">Clear</button></div></form></section>`}
function recList(key,detail){return `<div class="list">${db[key].slice().reverse().map(x=>`<div class="record"><div><b>${esc(x.name||x.title||x.productName||'Record')}</b><small>${esc(detail(x))}</small></div><div class="actions"><button class="btn small" onclick="editRec('${key}','${x.id}')">Edit</button><button class="btn small danger" onclick="deleteRec('${key}','${x.id}')">Delete</button></div></div>`).join('')||'<p class="muted">No records yet.</p>'}</div>`}
function options(key){return db[key].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function render(){let s='';
if(section==='Dashboard'){let totalSales=db.sales.reduce((a,x)=>a+x.total,0),custDebt=db.customers.reduce((a,x)=>a+Number(x.balance),0),suppDebt=db.suppliers.reduce((a,x)=>a+Number(x.balance),0),stock=db.products.reduce((a,x)=>a+Number(x.qty),0);
s=`<h2>${esc(db.settings.business||'Business')} overview</h2><div class="grid">
${metric('Products',db.products.length)}${metric('Stock units',stock)}${metric('Sales transactions',db.sales.length)}${metric('Sales total',fmt(totalSales,'Mixed'))}${metric('Customer receivables',fmt(custDebt,'Mixed'))}${metric('Supplier payables',fmt(suppDebt,'Mixed'))}${metric('Expenses',db.expenses.length)}${metric('Customers',db.customers.length)}</div>
<div class="notice">Data is stored locally in this browser on this device. Export backups frequently. This app does not sync between devices.</div><div class="card"><h3>Low stock</h3>${db.products.filter(p=>+p.qty<=5).map(p=>`<p>${esc(p.name)} — ${p.qty} left</p>`).join('')||'<span class="muted">No low-stock products.</span>'}</div>`}
if(section==='Stock'){s=form('Product details',f('Product name','name')+`<div class="row">${f('Opening / current quantity','qty','number',true,'min="0" step="any"')}${f('Cost price','cost','number',true,'min="0" step="any"')}</div><div class="row">${f('Retail sale price','retail','number',true,'min="0" step="any"')}${f('Wholesale sale price','wholesale','number',true,'min="0" step="any"')}</div>${cur()}${f('SKU / barcode','sku','text',false)}`,'saveProduct')+recList('products',x=>`Qty ${x.qty} · Retail ${fmt(x.retail,x.currency)} · Wholesale ${fmt(x.wholesale,x.currency)}`)}
if(section==='Customers'){s=form('Customer profile',f('Full name','name')+f('Phone / address','contact','text',false)+f('Opening amount customer owes','balance','number',true,'step="any"')+cur(),'saveCustomer')+recList('customers',x=>`${x.contact||''} · Owes ${fmt(x.balance,x.currency)}`)+form('Customer account transaction',`<label>Customer</label><select name="party" required>${options('customers')}</select><label>Transaction type</label><select name="type"><option value="received">Receive payment — reduce amount owed</option><option value="given">Give cash / goods — increase amount owed</option></select>${f('Amount','amount','number',true,'min="0.01" step="any"')}${cur()}`,'customerTxn')}
if(section==='Suppliers'){s=form('Supplier profile',f('Supplier name','name')+f('Phone / address','contact','text',false)+f('Opening amount payable','balance','number',true,'step="any"')+cur(),'saveSupplier')+recList('suppliers',x=>`${x.contact||''} · Payable ${fmt(x.balance,x.currency)}`)+form('Supplier payment / adjustment',`<label>Supplier</label><select name="party" required>${options('suppliers')}</select><label>Transaction</label><select name="type"><option value="paid">Pay supplier — reduce payable</option><option value="credit">New amount owed — increase payable</option></select>${f('Amount','amount','number',true,'min="0.01" step="any"')}${cur()}`,'supplierTxn')}
if(section==='Sales'){s=form('Create sale / invoice',`<label>Product</label><select name="product" required>${options('products')}</select><div class="row">${f('Quantity','qty','number',true,'min="0.01" step="any"')}${f('Unit price','price','number',true,'min="0" step="any"')}</div><label>Sale category</label><select name="kind"><option>Retail</option><option>Wholesale</option></select><label>Customer</label><select name="customer"><option value="">Cash customer</option>${options('customers')}</select><label>Payment status</label><select name="status"><option value="paid">Paid</option><option value="credit">Credit / unpaid</option></select>${cur()}${f('Notes','notes','text',false)}`,'saveSale')+recList('sales',x=>`${x.date} · ${x.qty} × ${x.productName} · ${fmt(x.total,x.currency)} · ${x.status}`)}
if(section==='Purchases'){s=form('Stock purchase / supplier invoice',`<label>Product</label><select name="product" required>${options('products')}</select><div class="row">${f('Quantity purchased','qty','number',true,'min="0.01" step="any"')}${f('Unit cost','price','number',true,'min="0" step="any"')}</div><label>Supplier</label><select name="supplier"><option value="">Cash purchase / no supplier</option>${options('suppliers')}</select><label>Payment status</label><select name="status"><option value="paid">Paid</option><option value="credit">Owed to supplier</option></select>${cur()}${f('Notes','notes','text',false)}`,'savePurchase')+recList('purchases',x=>`${x.date} · ${x.qty} × ${x.productName} · ${fmt(x.total,x.currency)} · ${x.status}`)}
if(section==='Expenses'){s=form('Business expense',f('Expense title','title')+f('Amount','amount','number',true,'min="0.01" step="any"')+cur()+f('Category / notes','notes','text',false),'saveExpense')+recList('expenses',x=>`${x.date} · ${fmt(x.amount,x.currency)} · ${x.notes||''}`)}
if(section==='Ledger'){let rows=[...db.sales.map(x=>({date:x.date,party:x.customerName||'Cash sale',type:'Sale invoice',amount:x.total,currency:x.currency})),...db.purchases.map(x=>({date:x.date,party:x.supplierName||'Cash purchase',type:'Stock purchase',amount:-x.total,currency:x.currency})),...db.expenses.map(x=>({date:x.date,party:x.title,type:'Expense',amount:-x.amount,currency:x.currency})),...db.customerTx.map(x=>({date:x.date,party:x.partyName,type:x.type==='received'?'Customer payment received':'Cash given to customer',amount:x.type==='received'?-x.amount:x.amount,currency:x.currency})),...db.supplierTx.map(x=>({date:x.date,party:x.partyName,type:x.type==='paid'?'Supplier payment':'Supplier credit',amount:x.type==='paid'?-x.amount:x.amount,currency:x.currency}))];
s=`<h2>Business ledger</h2><div class="card tablebox"><table><tr><th>Date</th><th>Party</th><th>Entry</th><th>Amount</th></tr>${rows.reverse().map(r=>`<tr><td>${r.date}</td><td>${esc(r.party)}</td><td>${esc(r.type)}</td><td>${fmt(r.amount,r.currency)}</td></tr>`).join('')}</table></div><h2>Customer statements</h2>${db.customers.map(c=>`<div class="card"><b>${esc(c.name)}</b><p>Balance: ${fmt(c.balance,c.currency)}</p>${db.sales.filter(x=>x.customerId===c.id).map(x=>`<small>${x.date} · Invoice ${fmt(x.total,x.currency)}</small><br>`).join('')}${db.customerTx.filter(x=>x.partyId===c.id).map(x=>`<small>${x.date} · ${x.type} ${fmt(x.amount,x.currency)}</small><br>`).join('')}</div>`).join('')}`}
if(section==='Reports'){s=`<h2>Reports</h2><div class="grid">${metric('Sales',db.sales.length)}${metric('Purchases',db.purchases.length)}${metric('Expenses',db.expenses.length)}${metric('Gross sales',fmt(db.sales.reduce((a,x)=>a+x.total,0),'Mixed'))}</div><div class="card tablebox"><h3>Sales report</h3><table><tr><th>Date</th><th>Invoice</th><th>Customer</th><th>Amount</th></tr>${db.sales.map(x=>`<tr><td>${x.date}</td><td>${x.invoice}</td><td>${esc(x.customerName)}</td><td>${fmt(x.total,x.currency)}</td></tr>`).join('')}</table></div><div class="card tablebox"><h3>Stock valuation (at cost)</h3><table><tr><th>Product</th><th>Qty</th><th>Cost</th><th>Value</th></tr>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${fmt(p.cost,p.currency)}</td><td>${fmt(p.qty*p.cost,p.currency)}</td></tr>`).join('')}</table></div>`}
if(section==='Backup'){s=`<h2>Backup & restore</h2><div class="card"><p>Export a full copy of your business records to keep safe or transfer to another device.</p><button class="btn primary" onclick="backup()">Download backup file</button><label>Restore backup file</label><input type="file" id="restorefile" accept=".json,application/json"><button class="btn" onclick="restore()">Restore selected backup</button><div class="notice">Restore replaces all current records. Make a backup first.</div></div>`}
if(section==='Settings'){s=form('Business settings',f('Business name','business')+f('Login username','username')+f('New password','password','text') ,'saveSettings')+`<div class="card"><h3>About TradeLux</h3><p>Created by Abdul Basit Khedam</p><p class="muted">Offline local-storage application. No cloud synchronization.</p><button class="btn danger" onclick="if(confirm('Sign out?')){sessionStorage.clear();location.reload()}">Sign out</button></div>`}
screen.innerHTML=s}
function metric(k,v){return `<div class="card"><div class="metric">${k}</div><div class="value">${v}</div></div>`}
function formData(e){return Object.fromEntries(new FormData(e.target).entries())}
function saveEntity(key,d){let old=editing&&db[key].find(x=>x.id===editing);if(old)Object.assign(old,d);else db[key].push({...d,id:uid()});editing=null;persist();render()}
function saveProduct(e){e.preventDefault();let d=formData(e);d.qty=+d.qty;d.cost=+d.cost;d.retail=+d.retail;d.wholesale=+d.wholesale;saveEntity('products',d)}
function saveCustomer(e){e.preventDefault();let d=formData(e);d.balance=+d.balance;saveEntity('customers',d)}
function saveSupplier(e){e.preventDefault();let d=formData(e);d.balance=+d.balance;saveEntity('suppliers',d)}
function saveSale(e){e.preventDefault();let d=formData(e),p=db.products.find(x=>x.id===d.product),c=db.customers.find(x=>x.id===d.customer);if(!p)return alert('Please add a product first');let q=+d.qty;if(q<=0||q>p.qty)return alert('Insufficient stock');if(d.status==='credit'&&!c)return alert('Choose a customer for credit sale');let total=q*+d.price;p.qty-=q;if(c&&d.status==='credit')c.balance=+c.balance+total;db.sales.push({id:uid(),date:today(),invoice:'TL-'+Date.now().toString().slice(-7),productId:p.id,productName:p.name,qty:q,price:+d.price,total,currency:d.currency,status:d.status,customerId:c?.id||'',customerName:c?.name||'Cash',kind:d.kind,notes:d.notes});persist();render()}
function savePurchase(e){e.preventDefault();let d=formData(e),p=db.products.find(x=>x.id===d.product),sup=db.suppliers.find(x=>x.id===d.supplier);if(!p)return alert('Please add a product first');let q=+d.qty,total=q*+d.price;p.qty=+p.qty+q;p.cost=+d.price;if(d.status==='credit'&&sup)sup.balance=+sup.balance+total;db.purchases.push({id:uid(),date:today(),productId:p.id,productName:p.name,qty:q,price:+d.price,total,currency:d.currency,status:d.status,supplierId:sup?.id||'',supplierName:sup?.name||'Cash',notes:d.notes});persist();render()}
function saveExpense(e){e.preventDefault();let d=formData(e);d.amount=+d.amount;db.expenses.push({...d,id:uid(),date:today()});persist();render()}
function customerTxn(e){e.preventDefault();let d=formData(e),c=db.customers.find(x=>x.id===d.party),a=+d.amount;if(!c)return alert('Add customer first');c.balance=Math.max(0,+c.balance+(d.type==='given'?a:-a));db.customerTx.push({id:uid(),date:today(),partyId:c.id,partyName:c.name,type:d.type,amount:a,currency:d.currency});persist();render()}
function supplierTxn(e){e.preventDefault();let d=formData(e),s=db.suppliers.find(x=>x.id===d.party),a=+d.amount;if(!s)return alert('Add supplier first');s.balance=Math.max(0,+s.balance+(d.type==='credit'?a:-a));db.supplierTx.push({id:uid(),date:today(),partyId:s.id,partyName:s.name,type:d.type,amount:a,currency:d.currency});persist();render()}
function saveSettings(e){e.preventDefault();let d=formData(e);db.settings={...db.settings,...d};persist();alert('Settings saved');render()}
function editRec(k,id){let x=db[k].find(y=>y.id===id);if(!x)return;editing=id;let msg='Selected record: '+(x.name||x.title||x.productName||'record')+'. For transaction records, delete and re-enter rather than editing, to avoid corrupting stock and balances.';alert(msg)}
function deleteRec(k,id){if(!confirm('Delete this record? For sales/purchases, stock and account balances are not automatically reversed. Restore a backup if unsure.'))return;db[k]=db[k].filter(x=>x.id!==id);persist();render()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TradeLux-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){let f=restorefile.files[0];if(!f)return alert('Select a backup file');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!KEYS.every(k=>Array.isArray(x[k])))throw Error();if(!confirm('Replace current records with this backup?'))return;db=x;persist();render();alert('Backup restored')}catch(e){alert('This is not a valid TradeLux backup')}};r.readAsText(f)}
</script></body></html>
